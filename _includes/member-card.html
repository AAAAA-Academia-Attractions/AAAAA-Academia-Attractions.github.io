{% assign person = include.person %}
<a class="member-card {{ include.extra_class }}" href="{{ person.url | relative_url }}" aria-label="{{ person.title }}">{% if person.portrait %}<div class="member-hex"><img{% if person.portrait_class %} class="{{ person.portrait_class }}"{% endif %} src="{{ person.portrait | relative_url }}" alt="Portrait of {{ person.title }}"></div>{% else %}<div class="member-hex">{{ person.hex_label | default: 'Portrait' }}</div>{% endif %}<div class="{{ include.identity_class }}"><h3>{{ person.title }}</h3><ul class="member-card__meta"><li><span class="visually-hidden">Role: </span>{{ person.role }}</li><li><span class="visually-hidden">Institution: </span>{{ person.institution }}</li><li><span class="visually-hidden">Research focus: </span>{{ person.focus }}</li></ul></div></a>
